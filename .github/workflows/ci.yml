name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - run: uv run ruff check .

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # This project has already caught real, OS-specific bugs the hard
        # way (Windows CRLF-mangling a file on every edit; a Linux/POSIX
        # PosixPath treating backslashes as an ordinary filename character
        # instead of a separator, silently letting a traversal string
        # through that Windows correctly rejected) -- ubuntu-only CI would
        # not have caught either one. All three, every run.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - run: uv run pytest -v
