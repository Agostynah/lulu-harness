name: Security surface notice

# Leaves a comment on any PR that touches the files where this project's
# safety guarantees actually live -- path sandboxing, permission
# decisions, blast-radius heuristics, or cross-session locking. Doesn't
# block anything; it just makes sure a reviewer (or an external
# contributor's own second look) doesn't skim past a change to the one
# part of the codebase where a subtle mistake has real consequences.

on:
  pull_request:
    paths:
      - "packages/lulu-core/src/lulu/permissions.py"
      - "packages/lulu-core/src/lulu/attention.py"
      - "packages/lulu-core/src/lulu/blast_radius.py"
      - "packages/lulu-core/src/lulu/locks.py"
      - "packages/lulu-core/src/lulu/tools/sandbox.py"

permissions:
  pull-requests: write

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- security-surface-notice -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (comments.some(c => c.body.includes(marker))) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: marker + "\n" +
                "**This PR touches a security-relevant file** (permission " +
                "decisions, path sandboxing, blast-radius detection, or " +
                "cross-session locking).\n\n" +
                "Before merging, please confirm:\n" +
                "- [ ] There's an adversarial test, not just a happy-path one " +
                "(a case that tries to defeat the check)\n" +
                "- [ ] Any new default fails closed (ASK/DENY), not open (ALLOW)\n" +
                "- [ ] No mode/preset can silently bypass this",
            });
