[project]
name = "lulu-router"
version = "0.1.0"
description = "Adaptive routing across cost-heterogeneous vector memory shards"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lulu_router"]
