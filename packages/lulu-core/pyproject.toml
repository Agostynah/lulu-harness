[project]
name = "lulu-core"
version = "0.1.0"
description = "Lulu agent harness core: model client, tool loop, permissions, sessions"
requires-python = ">=3.11"
dependencies = [
    "lulu-router",
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
    "openai>=1.50.0",
    "fastembed>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
lulu = "lulu.cli:main"
lulu-server = "lulu.server:run"

[tool.uv.sources]
lulu-router = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lulu"]
